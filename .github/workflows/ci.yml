name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================================================================
  # Node.js Backend Tests (algo-trading-backend-node)
  # ==================================================================
  node-backend:
    name: Node.js Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    defaults:
      run:
        working-directory: algo-trading/algo-trading-backend-node
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: algo-trading/algo-trading-backend-node/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-32-characters
          TRADING_MODE: paper

  # ==================================================================
  # Frontend Tests (algo-trading-frontend)
  # ==================================================================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: algo-trading/algo-trading-frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: algo-trading/algo-trading-frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build

  # ==================================================================
  # Python Backend Tests (algo_trading)
  # ==================================================================
  python-backend:
    name: Python Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    defaults:
      run:
        working-directory: algo-trading/algo_trading
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: algo-trading/algo_trading/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -v
        continue-on-error: true
        env:
          PYTHONPATH: .
          TESTING: true

  # ==================================================================
  # Java Backend Build & Test (algo-trading-backend)
  # ==================================================================
  java-backend:
    name: Java Backend (Maven)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: algo-trading/algo-trading-backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn -B clean compile --file pom.xml
      
      - name: Run tests
        run: mvn -B test --file pom.xml
        continue-on-error: true
      
      - name: Package application
        run: mvn -B package -DskipTests --file pom.xml

  # ==================================================================
  # Security & Quality Checks
  # ==================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          ! grep -r "api.*key.*=.*['\"]" --include="*.java" --include="*.ts" --include="*.py" algo-trading/ || echo "Warning: Found potential API keys"
          ! grep -r "password.*=.*['\"]" --include="*.java" --include="*.ts" --include="*.py" algo-trading/ || echo "Warning: Found potential passwords"
          echo "Security scan complete"
      
      - name: Verify .env.example exists
        run: |
          if [ ! -f "algo-trading/algo-trading-backend-node/.env.example" ]; then
            echo "Warning: .env.example missing in Node backend"
            exit 1
          fi

  # ==================================================================
  # Integration Tests
  # ==================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [node-backend, python-backend, java-backend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run integration tests
        run: |
          echo "Running broker adapter integration tests..."
          cd algo-trading/algo_trading
          pip install -r requirements.txt pytest
          pytest tests/integration/ --maxfail=1 -v || echo "Integration tests need setup"
        continue-on-error: true
